---
# =============================================================================
# ToM Server – Standard Configuration Example
#
# This is the standard ToM server configuration for
# a single Matrix homeserver.
#
# Required fields are marked [REQUIRED] and use
# <PLACEHOLDER> values.
# Optional fields are commented out with their
# defaults shown.
# Uncomment and change only what you need.
# =============================================================================

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server:
  # [REQUIRED] Matrix domain used in MXIDs (@user:example.com)
  name: "<YOUR_MATRIX_DOMAIN>"

  # Public-facing URL of this identity server.
  # Used in email templates and invitation links.
  # base_url: ""                   # Default: ""

  # host: "0.0.0.0"                # Default: "0.0.0.0"
  # port: 3000                     # Default: 3000
  # trust_x_forwarded_for: false   # Default: false — behind reverse proxy
  # trusted_proxies: []            # Default: [] — list of trusted proxies
  # additional_features: false     # Default: false — extra company features
  # enable_cron_jobs: false        # Default: false
  #                                # master switch for all scheduled jobs

  # rate_limiting:
  #   window_ms: 60000             # Default: 60000 (1 minute)
  #   max_requests: 100            # Default: 100

# -----------------------------------------------------------------------------
# URLs – external endpoints referenced in emails, QR codes, redirects.
# All optional, all default to "".
# -----------------------------------------------------------------------------
# urls:
#   signup: ""
#   chat: ""
#   auth: ""
#   qr_code: ""
#   invitation_redirect: ""

# -----------------------------------------------------------------------------
# Synapse (homeserver integration)
# -----------------------------------------------------------------------------
synapse:
  # [REQUIRED] Public URL of the homeserver
  server_url: "<https://matrix.example.com>"

  # internal_host: "http://localhost:8008"  # Default: "http://localhost:8008"

  admin:
    # [REQUIRED] Synapse admin credentials
    login: "<ADMIN_USER>"
    password: "<ADMIN_PASSWORD>"
    # access_token: ""             # Default: ""
    #                              # set if using token auth instead

  database:
    # [REQUIRED] Synapse database connection
    host: "<SYNAPSE_DB_HOST>"
    name: "<SYNAPSE_DB_NAME>"
    user: "<SYNAPSE_DB_USER>"
    password: "<SYNAPSE_DB_PASSWORD>"
    # ssl: false                   # Default: false
    # vacuum_delay: 3600           # Default: 3600 (seconds)

# -----------------------------------------------------------------------------
# ToM database
# -----------------------------------------------------------------------------
database:
  # [REQUIRED] Tom's own database connection
  host: "<TOM_DB_HOST>"
  name: "<TOM_DB_NAME>"
  user: "<TOM_DB_USER>"
  password: "<TOM_DB_PASSWORD>"
  # ssl: false                     # Default: false
  # vacuum_delay: 3600             # Default: 3600 (seconds)

# -----------------------------------------------------------------------------
# Hash lookups (3PID → MXID pepper management)
# All optional with sensible defaults.
# -----------------------------------------------------------------------------
# hash:
#   rate_limit: 100                # Default: 100 — max hash lookup
#                                  # requests per rate window
#   key_delay: 3600                # Default: 3600 — seconds before a new
#                                  # pepper key activates
#   keys_depth: 5                  # Default: 5 — number of old pepper
#                                  # keys to retain
#   pepper_cron: "0 0 * * *"       # Default: "0 0 * * *" — requires
#                                  # enable_cron_jobs: true

# -----------------------------------------------------------------------------
# Invitations
# All optional.
# -----------------------------------------------------------------------------
# invitations:
#   server_name: "matrix.to"       # Default: "matrix.to"

# -----------------------------------------------------------------------------
# Terms of service / policies
# Optional. Uncomment and define policies per the Matrix spec.
# -----------------------------------------------------------------------------
# terms:
#   policies:
#     privacy_policy:
#       version: "1.0"
#       en:
#         name: "Privacy Policy"
#         url: "https://example.com/privacy"

# -----------------------------------------------------------------------------
# SMTP / email
# Required if sending verification emails or invitations.
# -----------------------------------------------------------------------------
email:
  # [REQUIRED] SMTP server hostname
  smtp_host: "<SMTP_HOST>"

  # smtp_port: 587                 # Default: 587
  # tls: true                      # Default: true
  # username: ""                   # Optional — omit for unauthenticated SMTP
  # password: ""                   # Optional
  # sender: ""                     # Optional — From address
  # sender_localpart: "twake"      # Default: "twake"
  # verify_certificate: true       # Default: true
  # templates_dir: ""              # Default: "" — resolved from
  #                                # platform share dirs
  # link_expiry: 3600              # Default: 3600 (seconds)

# -----------------------------------------------------------------------------
# LDAP
# Optional. Entire section defaults to disabled.
# -----------------------------------------------------------------------------
# ldap:
#   uri: "ldap://localhost:389"
#   base: "dc=example,dc=com"
#   user: ""
#   password: ""
#   filter: ""
#   uid_field: "uid"               # Default: "uid"
#   sync_cron: "*/10 * * * *"      # Default: "*/10 * * * *" — requires
#                                  # enable_cron_jobs: true
#   client_options: {}             # Raw ldapts client options — optional

# -----------------------------------------------------------------------------
# Cache
# Optional. Defaults to in-memory.
# -----------------------------------------------------------------------------
# cache:
#   engine: "memory"               # Default: "memory" — "memory" | "redis"
#   ttl: 3600                      # Default: 3600 (seconds)
#   redis_uri: "redis://localhost:6379"  # Required when engine is "redis"

# -----------------------------------------------------------------------------
# SMS
# Optional. Required only if using phone-based 3PID verification.
# -----------------------------------------------------------------------------
# sms:
#   api_url: "https://api.octopush.com/v1/public"  # Default
#   api_login: ""
#   api_key: ""

# -----------------------------------------------------------------------------
# Federation
# Optional. Disabled by default.
# Set is_federated_identity_service: true to enable federation mode
# -----------------------------------------------------------------------------
# federation:
#   is_federated_identity_service: false     # Default: false — set to true
#                                           # for federation service
#   trusted_servers_addresses: []            # Default: [] — IP allowlist
#                                           # for trusted Matrix servers
#   identity_services: []                    # Default: [] — list of peer
#                                           # identity services
#   sync_cron: "*/10 * * * *"                # Default: "*/10 * * * *"
#                                           # — requires enable_cron_jobs: true

# -----------------------------------------------------------------------------
# Jitsi
# Optional. Disabled by default.
# -----------------------------------------------------------------------------
# jitsi:
#   base_url: ""                   # Default: ""
#   use_jwt: false                 # Default: false
#   jwt_secret: ""
#   jwt_issuer: ""
#   jwt_algorithm: "HS256"         # Default: "HS256"
#   preferred_domain: ""

# -----------------------------------------------------------------------------
# OIDC
# Optional.
# -----------------------------------------------------------------------------
# oidc:
#   issuer: "https://sso.example.com"

# -----------------------------------------------------------------------------
# Twake Chat (client environment config)
# Optional. All fields have defaults. Uncomment to override.
# -----------------------------------------------------------------------------
# twake_chat:
#   application_name: "Twake Chat"  # Default
#   application_welcome_message: ""
#   privacy_url: ""
#   render_html: true              # Default: true
#   hide_redacted_events: false    # Default: false
#   hide_unknown_events: true      # Default: true
#   issue_id: ""
#   registration_url: ""
#   twake_workplace_homeserver: ""
#   app_grid_dashboard_available: false  # Default: false
#   platform: ""
#   default_max_upload_avatar_size_in_bytes: ""  # Default: "" (no limit)
#   dev_mode: false                # Default: false
#   qr_code_download_url: ""
#   enable_logs: false             # Default: false
#   support_url: ""
#   enable_invitations: false      # Default: false

# -----------------------------------------------------------------------------
# Features
# Optional. All disabled by default.
# -----------------------------------------------------------------------------
# features:
#   common_settings:
#     enabled: false               # Default: false
#     application_url: ""
#   matrix_profile_updates_allowed: true   # Default: true
#   user_profile:
#     default_visibility_settings:
#       visibility: "private"      # Default: "private"
#       visible_fields: []         # Default: []
#   user_directory:
#     enabled: false               # Default: false
#   createroom_proxy:              # Optional — omit entirely to disable
#     enabled: false
#     on_failure:
#       max_retries: 3             # Default: 3
#       nuke_room: true            # Default: true
#     default_preset: "private_chat"  # Default: "private_chat"
#     encryption: "allowed"        # Default: "allowed"
#       one of: "allowed" | "enforced" | "disabled"
#     presets: []                  # See documentation for preset structure

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# logger:
#   level: "info"                  # Default: "info"
#   pretty: false                  # Default: false — enable for local dev only

# -----------------------------------------------------------------------------
# Internationalisation
# -----------------------------------------------------------------------------
# i18n:
#   locale: "en"                   # Default: "en"
#   locales_path: "/usr/share/twake/chat/tom/i18n"  # Default

# -----------------------------------------------------------------------------
# Landing page
# Optional. If the file doesn't exist, the route is not mounted.
# -----------------------------------------------------------------------------
# landing:
#   file_path: "/usr/share/twake/chat/tom/landing.html"  # Default

# -----------------------------------------------------------------------------
# Matrix client discovery
# Optional. Disabled by default.
#
# Everything below is genuinely new — nothing else in this file owns it.
# -----------------------------------------------------------------------------
# well_known:
#   client:
#     enabled: true   # Default: false
#     extra: {}       # Default: {} — shallow-merged into the document first;
#                     # will be overriden by any configured key:
#                     #   - m.homeserver: `base_url` from `synapse` config
#                     #   - m.identity_server: `base_url` from `server` config
#                     #   - t.server: `base_url` and `server_name` from
#                     #     `server` config
#                     #   - m.federated_identity_services: `base_urls` from
#                     #     `federation` config

# -----------------------------------------------------------------------------
# Matrix authentication
# Optional. Used by the routes authenticated with a Matrix access token.
# Tokens are checked on `synapse.server_url` (`/account/whoami`).
# -----------------------------------------------------------------------------
# auth:
#   token_cache_size: 1000         # Default: 1000 — validated tokens kept
#   token_cache_ttl_ms: 60000      # Default: 60000 — validation lifetime
#   timeout_ms: 10000              # Default: 10000 — per homeserver request

# -----------------------------------------------------------------------------
# Visio (video call rooms)
# Optional. Disabled by default.
# Serves POST /_twake/v1/video_call/rooms; answers 404 while disabled.
# Tokens are checked as described in `auth`; the user's email is the one the
# homeserver knows (`/account/3pid`).
# -----------------------------------------------------------------------------
# visio:
#   enabled: false                 # Default: false
#   base_url: "https://visio.example.com" # Required when enabled
#   client_id: ""                  # Required when enabled — Application
#   client_secret: ""              # Required when enabled
#   room_access_level: "trusted"   # Optional — "public" | "trusted" |
#                                  # "restricted"; unset: service default.
#                                  # Ignored by Meet before 1.17.0
#   timeout_ms: 10000              # Default: 10000 — per service request
#   # The calls of Twake Chat (D30): the rooms Meet makes for the Matrix rooms
#   # belong to this account (no human enters through Meet's UI), with this
#   # configuration. Needs `livekit` below.
#   service_account_email: "visio@example.com"
#   room_configuration:
#     screen_recording_permission: authenticated  # Default — or admin_owner
#     transcript_permission: authenticated        # Default — or admin_owner
#     everyone_can_mute: false                    # Default

# -----------------------------------------------------------------------------
# LiveKit: the MatrixRTC token service of the calls of Twake Chat (MSC4195)
# Optional. Disabled by default.
# Serves POST /_twake/v1/video_call/sfu/get: the well-known of the homeserver
# names it as `org.matrix.msc4143.rtc_foci[].livekit_service_url` (without
# the `/sfu/get`). With `visio` enabled, Meet mints the token so that its
# functions (recording, transcription…) know the participant; without it, or
# when Meet fails, ToM signs the token itself with the key below.
# -----------------------------------------------------------------------------
# livekit:
#   enabled: false                 # Default: false
#   # Required when enabled — as the browsers reach it
#   url: "wss://livekit.example.com"
#   # Required when enabled — the key LiveKit and Meet share
#   api_key: ""
#   api_secret: ""                 # Required when enabled
#   # Default: 6 hours — LiveKit refreshes it while connected
#   token_ttl_seconds: 21600

# -----------------------------------------------------------------------------
# GIFs for Twake Chat, through ToM: Klipy never sees the users. Off by default.
# The admin API (`/_twake/v1/admin/features/gifs`, Bearer
# `synapse.admin.access_token`) switches it at run time and overrides `enabled`.
# -----------------------------------------------------------------------------
# gifs:
#   enabled: false                 # Default: false. Without a key, always off
#   klipy_api_key: ""              # Secret
#   klipy_base_url: "https://api.klipy.com"
#   customer_id_secret: ""         # Default: the API key
#   content_filter: medium         # off, low, medium or high
#   timeout_ms: 15000
#   max_media_bytes: 15728640
#   trending_cache_ttl_ms: 300000

# -----------------------------------------------------------------------------
# Telemetry (OpenTelemetry)
# Disabled by default.
# -----------------------------------------------------------------------------
# telemetry:
#   enabled: false                 # Default: false
#   metrics_endpoint: "/metrics"   # Default: "/metrics"
#   otlp_endpoint: ""             # Optional — OTLP collector for export
#   trace_sample_ratio: 1.0        # Default: 1.0 (sample everything)
#   diag_log_level: "NONE"        # Default: "NONE" — for OTel debugging

# The assistants of the users (Twake Chat): one bot per user, a profile each on
# the shared Hermes agent. `POST /_twake/v1/bots/me` provisions and answers
# { userId, deviceId, masterKey }; `GET /_twake/v1/bots/me` answers the same
# without provisioning, or 404 M_BOT_NOT_FOUND when the user has no bot.
# bots:
#   enabled: false
#   # Who serves the bots, one backend per ToM: hermes, a profile per user for
#   # the shared Hermes agent (the keys below)
#   backend: hermes
#   # $HERMES_HOME/profiles of the agent, as ToM sees it
#   hermes_profiles_dir: /opt/hermes/profiles
#   hermes_home: /opt/data  # the home of the agent as the agent sees it
#   # as Hermes reaches it; the public URL when unset
#   hermes_homeserver_url: http://synapse:8008
#   model:
#     provider: openrouter
#     name: anthropic/claude-haiku-4.5
#     api_key: ""
#   bot_localpart_prefix: bot_
#   device_id_prefix: HERMES
#   ready_timeout_ms: 12000
#   publish_interval_ms: 60000
#   commands:
#     - name: help
#       syntax: help
#       description: What the assistant can do

# The same section on a ToM served by the agent harness of the platform, which
# owns the bots as its Matrix application service: no Hermes key there.
# bots:
#   enabled: true
#   backend: harness
#   harness:
#     url: https://gateway.example.com/agents  # the base of the harness API
#     token_url: https://auth.example.com/oauth2/token
#     client_id: tom
#     client_secret: change-me
#     # the scope of the token request; LemonLDAP-NG refuses one with none
#     scope: openid
